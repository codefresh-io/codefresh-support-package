name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers the workflow on new tags that start with 'v'

jobs:
  build:
    # NativeAOT cannot cross-compile between operating systems, so each target builds on a native runner.
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, name: linux_amd64, archive: tar.gz }
          - { os: ubuntu-24.04-arm, rid: linux-arm64, name: linux_arm64, archive: tar.gz }
          - { os: macos-13, rid: osx-x64, name: darwin_amd64, archive: tar.gz }
          - { os: macos-latest, rid: osx-arm64, name: darwin_arm64, archive: tar.gz }
          - { os: windows-latest, rid: win-x64, name: windows_amd64, archive: zip }
          - { os: windows-11-arm, rid: win-arm64, name: windows_arm64, archive: zip }
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install native toolchain (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish
        shell: bash
        run: |
          dotnet publish src/CfSupport/CfSupport.csproj -c Release -r ${{ matrix.rid }} \
            -p:Version="${TAG_NAME#v}" -o publish
        env:
          TAG_NAME: ${{ github.ref_name }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          BIN=cf-support_${{ matrix.name }}
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp publish/cf-support.exe "$BIN.exe"
            7z a "dist/$BIN.zip" "$BIN.exe"
          else
            cp publish/cf-support "$BIN"
            tar -czf "dist/$BIN.tar.gz" "$BIN"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: cf-support_${{ matrix.name }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: dist/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false
